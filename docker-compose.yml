services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: dadgar
      POSTGRES_USER: dadgar
      POSTGRES_PASSWORD: dadgar-local
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - dadgar_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dadgar -d dadgar"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  dadgar_postgres_data:
