name: Deploy to Cloudflare Workers

on:
  push:
    branches:
      - main

  workflow_dispatch:

concurrency:
  group: dadgar-production
  cancel-in-progress: false

permissions:
  contents: read

env:
  NEXT_TELEMETRY_DISABLED: "1"
  NEXT_IGNORE_INCORRECT_LOCKFILE: "1"

  NEXT_PUBLIC_SITE_URL: "https://majidsavarivakil.ir"
  APP_BASE_URL: "https://majidsavarivakil.ir"

  AUTH0_DOMAIN: ${{ secrets.AUTH0_DOMAIN }}
  AUTH0_CLIENT_ID: ${{ secrets.AUTH0_CLIENT_ID }}
  AUTH0_CLIENT_SECRET: ${{ secrets.AUTH0_CLIENT_SECRET }}
  AUTH0_SECRET: ${{ secrets.AUTH0_SECRET }}

  AUTH0_ROLE_CLAIM_NAMESPACE: "https://majidsavarivakil.ir"
  AUTH0_ADMIN_EMAILS: ${{ secrets.AUTH0_ADMIN_EMAILS }}

  AUTH0_M2M_CLIENT_ID: ${{ secrets.AUTH0_M2M_CLIENT_ID }}
  AUTH0_M2M_CLIENT_SECRET: ${{ secrets.AUTH0_M2M_CLIENT_SECRET }}
  AUTH0_DB_CONNECTION: "Username-Password-Authentication"

  DATABASE_URL: ${{ secrets.DATABASE_URL }}
  DATABASE_SSL: "true"

  IMAGEKIT_PUBLIC_KEY: ${{ secrets.IMAGEKIT_PUBLIC_KEY }}
  IMAGEKIT_PRIVATE_KEY: ${{ secrets.IMAGEKIT_PRIVATE_KEY }}
  IMAGEKIT_URL_ENDPOINT: ${{ secrets.IMAGEKIT_URL_ENDPOINT }}

  IMAGEKIT_PUBLIC_FOLDER: "/blog-images"
  IMAGEKIT_PRIVATE_FOLDER: "/client-documents"

jobs:
  deploy:
    name: Build and Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "npm"

      - name: Show versions
        run: |
          node --version
          npm --version

      - name: Install dependencies
        run: |
          npm install \
            --include=optional \
            --no-audit \
            --no-fund

      - name: TypeScript check
        run: npm run typecheck

      - name: ESLint check
        run: npm run lint

      - name: Build OpenNext worker
        run: npm run cf:build

      - name: Validate Cloudflare credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx --yes wrangler@4 whoami

      - name: Deploy OpenNext Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx --yes @opennextjs/cloudflare@1.20.2 deploy --keep-vars

      - name: Create Worker runtime secrets file
        shell: bash
        run: |
          node <<'NODE'
          const fs = require("fs");

          const keys = [
            "APP_BASE_URL",

            "AUTH0_DOMAIN",
            "AUTH0_CLIENT_ID",
            "AUTH0_CLIENT_SECRET",
            "AUTH0_SECRET",
            "AUTH0_ROLE_CLAIM_NAMESPACE",
            "AUTH0_ADMIN_EMAILS",

            "AUTH0_M2M_CLIENT_ID",
            "AUTH0_M2M_CLIENT_SECRET",
            "AUTH0_DB_CONNECTION",

            "DATABASE_URL",
            "DATABASE_SSL",

            "IMAGEKIT_PUBLIC_KEY",
            "IMAGEKIT_PRIVATE_KEY",
            "IMAGEKIT_URL_ENDPOINT",
            "IMAGEKIT_PUBLIC_FOLDER",
            "IMAGEKIT_PRIVATE_FOLDER"
          ];

          const output = {};

          for (const key of keys) {
            const value = process.env[key];

            if (typeof value !== "string" || value.length === 0) {
              throw new Error(`Missing runtime variable: ${key}`);
            }

            output[key] = value;
          }

          fs.writeFileSync(
            ".worker-secrets.json",
            JSON.stringify(output)
          );
          NODE

      - name: Upload Worker runtime secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx --yes wrangler@4 secret bulk \
            .worker-secrets.json \
            --config wrangler.jsonc

      - name: Remove temporary secrets file
        if: always()
        run: rm -f .worker-secrets.json
