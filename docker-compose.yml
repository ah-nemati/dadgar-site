name: Deploy to Cloudflare Workers

on:
  push:
    branches:
      - main

  workflow_dispatch:

concurrency:
  group: dadgar-production
  cancel-in-progress: false

permissions:
  contents: read

env:
  # جلوگیری از Telemetry و patch خودکار lockfile
  NEXT_TELEMETRY_DISABLED: "1"
  NEXT_IGNORE_INCORRECT_LOCKFILE: "1"

  # URL اصلی سایت
  NEXT_PUBLIC_SITE_URL: "https://majidsavarivakil.ir"
  APP_BASE_URL: "https://majidsavarivakil.ir"

  # Auth0
  AUTH0_DOMAIN: ${{ secrets.AUTH0_DOMAIN }}
  AUTH0_CLIENT_ID: ${{ secrets.AUTH0_CLIENT_ID }}
  AUTH0_CLIENT_SECRET: ${{ secrets.AUTH0_CLIENT_SECRET }}
  AUTH0_SECRET: ${{ secrets.AUTH0_SECRET }}

  AUTH0_ROLE_CLAIM_NAMESPACE: "https://majidsavarivakil.ir"
  AUTH0_ADMIN_EMAILS: ${{ secrets.AUTH0_ADMIN_EMAILS }}

  AUTH0_M2M_CLIENT_ID: ${{ secrets.AUTH0_M2M_CLIENT_ID }}
  AUTH0_M2M_CLIENT_SECRET: ${{ secrets.AUTH0_M2M_CLIENT_SECRET }}
  AUTH0_DB_CONNECTION: "Username-Password-Authentication"

  # Database / Neon
  DATABASE_URL: ${{ secrets.DATABASE_URL }}
  DATABASE_SSL: "true"

  # ImageKit
  IMAGEKIT_PUBLIC_KEY: ${{ secrets.IMAGEKIT_PUBLIC_KEY }}
  IMAGEKIT_PRIVATE_KEY: ${{ secrets.IMAGEKIT_PRIVATE_KEY }}
  IMAGEKIT_URL_ENDPOINT: ${{ secrets.IMAGEKIT_URL_ENDPOINT }}

  IMAGEKIT_PUBLIC_FOLDER: "/blog-images"
  IMAGEKIT_PRIVATE_FOLDER: "/client-documents"

jobs:
  deploy:
    name: Build and Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      # -----------------------------------------
      # Checkout
      # -----------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v7

      # -----------------------------------------
      # Node.js
      # -----------------------------------------
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"

      - name: Show versions
        run: |
          echo "Node:"
          node --version

          echo "npm:"
          npm --version

      # -----------------------------------------
      # Dependencies
      # -----------------------------------------
      - name: Install dependencies including SWC optional packages
        run: |
          npm install \
            --include=optional \
            --no-audit \
            --no-fund

      # -----------------------------------------
      # Validate required secrets
      # -----------------------------------------
      - name: Validate required environment variables
        shell: bash
        run: |
          required_vars=(
            AUTH0_DOMAIN
            AUTH0_CLIENT_ID
            AUTH0_CLIENT_SECRET
            AUTH0_SECRET
            AUTH0_M2M_CLIENT_ID
            AUTH0_M2M_CLIENT_SECRET
            DATABASE_URL
            IMAGEKIT_PUBLIC_KEY
            IMAGEKIT_PRIVATE_KEY
            IMAGEKIT_URL_ENDPOINT
            CLOUDFLARE_API_TOKEN
            CLOUDFLARE_ACCOUNT_ID
          )

          failed=0

          for var in "${required_vars[@]}"; do
            if [ -z "${!var}" ]; then
              echo "::error::Missing required variable: $var"
              failed=1
            else
              echo "✓ $var"
            fi
          done

          if [ "$failed" -ne 0 ]; then
            exit 1
          fi
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # -----------------------------------------
      # Check static assets
      # -----------------------------------------
      - name: Validate required assets
        shell: bash
        run: |
          test -f public/images/profile.jpeg || {
            echo "::error::public/images/profile.jpeg was not found"
            exit 1
          }

          echo "✓ profile.jpeg exists"

      # -----------------------------------------
      # Project validation
      # -----------------------------------------
      - name: Validate source
        run: |
          npm run audit:storage
          npm run audit:runtime
          npm run typecheck
          npm run lint

      # -----------------------------------------
      # OpenNext build
      # -----------------------------------------
      - name: Build OpenNext worker
        run: npm run cf:build

      # -----------------------------------------
      # Validate Cloudflare authentication
      # -----------------------------------------
      - name: Check Cloudflare authentication
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx --yes wrangler@4 whoami

      # -----------------------------------------
      # Deploy
      # -----------------------------------------
      - name: Deploy Worker
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx --yes wrangler@4 deploy \
            --config wrangler.jsonc \
            --keep-vars
