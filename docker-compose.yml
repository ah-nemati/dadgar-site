name: Deploy to Cloudflare Workers

on:
  workflow_dispatch:
  push:
    branches:
      - main

concurrency:
  group: cloudflare-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      NEXT_TELEMETRY_DISABLED: "1"
      NEXT_IGNORE_INCORRECT_LOCKFILE: "1"

      NEXT_PUBLIC_SITE_URL: https://majidsavarivakil.ir
      APP_BASE_URL: https://majidsavarivakil.ir

      AUTH0_DOMAIN: ${{ secrets.AUTH0_DOMAIN }}
      AUTH0_CLIENT_ID: ${{ secrets.AUTH0_CLIENT_ID }}
      AUTH0_CLIENT_SECRET: ${{ secrets.AUTH0_CLIENT_SECRET }}
      AUTH0_SECRET: ${{ secrets.AUTH0_SECRET }}
      AUTH0_ROLE_CLAIM_NAMESPACE: https://majidsavarivakil.ir
      AUTH0_ADMIN_EMAILS: ${{ secrets.AUTH0_ADMIN_EMAILS }}

      AUTH0_M2M_CLIENT_ID: ${{ secrets.AUTH0_M2M_CLIENT_ID }}
      AUTH0_M2M_CLIENT_SECRET: ${{ secrets.AUTH0_M2M_CLIENT_SECRET }}
      AUTH0_DB_CONNECTION: Username-Password-Authentication

      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DATABASE_SSL: "true"

      IMAGEKIT_PUBLIC_KEY: ${{ secrets.IMAGEKIT_PUBLIC_KEY }}
      IMAGEKIT_PRIVATE_KEY: ${{ secrets.IMAGEKIT_PRIVATE_KEY }}
      IMAGEKIT_URL_ENDPOINT: ${{ secrets.IMAGEKIT_URL_ENDPOINT }}
      IMAGEKIT_PUBLIC_FOLDER: /blog-images
      IMAGEKIT_PRIVATE_FOLDER: /client-documents

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm install --include=optional --no-audit --no-fund

      - name: Validate source
        run: |
          npm run audit:storage
          npm run audit:runtime
          npm run typecheck
          npm run lint

      - name: Build OpenNext Worker
        run: npm run cf:build

      - name: Create Cloudflare runtime secrets
        shell: bash
        run: |
          node <<'NODE'
          const fs = require("fs");

          const keys = [
            "APP_BASE_URL",

            "AUTH0_DOMAIN",
            "AUTH0_CLIENT_ID",
            "AUTH0_CLIENT_SECRET",
            "AUTH0_SECRET",
            "AUTH0_ROLE_CLAIM_NAMESPACE",
            "AUTH0_ADMIN_EMAILS",
            "AUTH0_M2M_CLIENT_ID",
            "AUTH0_M2M_CLIENT_SECRET",
            "AUTH0_DB_CONNECTION",

            "DATABASE_URL",
            "DATABASE_SSL",

            "IMAGEKIT_PUBLIC_KEY",
            "IMAGEKIT_PRIVATE_KEY",
            "IMAGEKIT_URL_ENDPOINT",
            "IMAGEKIT_PUBLIC_FOLDER",
            "IMAGEKIT_PRIVATE_FOLDER"
          ];

          const secrets = {};

          for (const key of keys) {
            const value = process.env[key];

            if (typeof value !== "string" || value.length === 0) {
              throw new Error(`Missing runtime variable: ${key}`);
            }

            secrets[key] = value;
          }

          fs.writeFileSync(
            ".worker-secrets.json",
            JSON.stringify(secrets)
          );
          NODE

      - name: Deploy Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --secrets-file .worker-secrets.json --keep-vars

      - name: Remove temporary secrets file
        if: always()
        run: rm -f .worker-secrets.json
