name: Deploy to Cloudflare Workers

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: dadgar-production
  cancel-in-progress: false

permissions:
  contents: read

env:
  NEXT_TELEMETRY_DISABLED: "1"
  NEXT_IGNORE_INCORRECT_LOCKFILE: "1"

  NEXT_PUBLIC_SITE_URL: "https://majidsavarivakil.ir"
  APP_BASE_URL: "https://majidsavarivakil.ir"

  SESSION_SECRET: ${{ secrets.SESSION_SECRET }}

  DATABASE_URL: ${{ secrets.DATABASE_URL }}
  DATABASE_SSL: "true"

  INITIAL_ADMIN_EMAIL: ${{ secrets.INITIAL_ADMIN_EMAIL }}
  INITIAL_ADMIN_PASSWORD: ${{ secrets.INITIAL_ADMIN_PASSWORD }}
  INITIAL_ADMIN_NAME: ${{ secrets.INITIAL_ADMIN_NAME }}
  INITIAL_ADMIN_PHONE: ${{ secrets.INITIAL_ADMIN_PHONE }}
  INITIAL_LAWYER_EMAIL: ${{ secrets.INITIAL_LAWYER_EMAIL }}
  INITIAL_LAWYER_PASSWORD: ${{ secrets.INITIAL_LAWYER_PASSWORD }}
  INITIAL_LAWYER_PHONE: ${{ secrets.INITIAL_LAWYER_PHONE }}

  IMAGEKIT_PUBLIC_KEY: ${{ secrets.IMAGEKIT_PUBLIC_KEY }}
  IMAGEKIT_PRIVATE_KEY: ${{ secrets.IMAGEKIT_PRIVATE_KEY }}
  IMAGEKIT_URL_ENDPOINT: ${{ secrets.IMAGEKIT_URL_ENDPOINT }}

  IMAGEKIT_PUBLIC_FOLDER: "/blog-images"
  IMAGEKIT_PRIVATE_FOLDER: "/client-documents"

jobs:
  deploy:
    name: Build and Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: |
          npm install \
            --include=optional \
            --no-audit \
            --no-fund

      - name: Storage audit
        run: npm run audit:storage

      - name: Apply database migrations
        run: npm run db:migrate

      - name: Seed required accounts and public content
        run: npm run db:seed

      - name: Runtime audit
        run: npm run audit:runtime

      - name: TypeScript check
        run: npm run typecheck

      - name: ESLint check
        run: npm run lint

      - name: Create Worker secrets file
        shell: bash
        run: |
          node <<'NODE'
          const fs = require("fs");

          const keys = [
            "SESSION_SECRET",
            "DATABASE_URL",
            "IMAGEKIT_PUBLIC_KEY",
            "IMAGEKIT_PRIVATE_KEY",
            "IMAGEKIT_URL_ENDPOINT"
          ];

          const lines = [];

          for (const key of keys) {
            const value = process.env[key];

            if (!value || !value.trim()) {
              throw new Error(`Missing required secret: ${key}`);
            }

            const escaped = value
              .replace(/\\/g, "\\\\")
              .replace(/"/g, '\\"')
              .replace(/\n/g, "\\n");

            lines.push(`${key}="${escaped}"`);
          }

          fs.writeFileSync(
            ".worker-secrets.env",
            lines.join("\n") + "\n"
          );
          NODE

      - name: Build OpenNext Worker
        run: |
          npx --yes @opennextjs/cloudflare@1.20.2 build

      - name: Verify OpenNext output
        shell: bash
        run: |
          test -f .open-next/worker.js || {
            echo "::error::.open-next/worker.js does not exist"
            exit 1
          }

          echo "OpenNext output is ready."

      - name: Validate Cloudflare credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx --yes wrangler@4.120.0 whoami

      - name: Deploy OpenNext Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npm run cf:deploy -- --secrets-file .worker-secrets.env

      - name: Remove temporary secrets file
        if: always()
        run: |
          rm -f .worker-secrets.env
